name: Validate Canaveral
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: validate-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  migration-coordination:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: coordination
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: coordination/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck && npm run build && npm test
  migration-execution:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.0'
          cache: pip
          cache-dependency-path: .github/requirements-test.txt
      - run: python -m pip install --require-hashes -r .github/requirements-test.txt
      - run: ./script/test.sh
      - run: python3 fixtures/migration/verify_lease_guard.py
      - run: node --check canaveral/web/app.js
      - name: Install kubectl with checksum verification
        run: |
          curl --fail --location --retry 3 -o /tmp/kubectl https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
          curl --fail --location --retry 3 -o /tmp/kubectl.sha256 https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl.sha256
          echo "$(cat /tmp/kubectl.sha256)  /tmp/kubectl" | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
      - run: kubectl kustomize deploy/orchestrator && kubectl kustomize deploy/dashboard
  dashboard:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit --audit-level=moderate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build && git diff --exit-code -- ../canaveral/web
      - run: npx playwright install --with-deps chromium --only-shell
      - run: npm run test:browser
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: dashboard-browser-failure
          path: dashboard/test-results
          retention-days: 7
          if-no-files-found: ignore
  model-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: coordination/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-model-conformance
      - run: cargo build -p canaveral-model-execution --locked
      - name: Build disposable runtime fixture and locate compiler artifact
        env:
          MODEL_ARTIFACTS: ${{ runner.temp }}/model-artifacts.jsonl
        run: |
          cargo test -p canaveral-model-execution --test owned --no-run --locked --message-format=json > "$MODEL_ARTIFACTS"
          node --input-type=module <<'JSCODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          const artifacts = readFileSync(process.env.MODEL_ARTIFACTS, 'utf8').trim().split('\n').map(line => JSON.parse(line));
          const fixture = artifacts.find(a => a.reason === 'compiler-artifact' && a.target.name === 'owned' && a.executable);
          if (!fixture) throw new Error('Missing owned runtime fixture artifact');
          appendFileSync(process.env.GITHUB_ENV, `MODEL_RUNTIME_FIXTURE=${fixture.executable}\n`);
          JSCODE
      - run: npm --prefix coordination ci --ignore-scripts && npm --prefix coordination run build
      - name: Public API TypeScript controller and Rust execution fixtures
        run: node fixtures/model-execution/public-api.mjs coordination/dist/src/main.js target/debug/canaveral-model-execution "$MODEL_RUNTIME_FIXTURE"
  runner-conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: coordination/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-runner-conformance
      - run: rustup show
      - run: cargo build -p canaveral-runner-client --bins --examples --locked
      - run: npm --prefix coordination ci --ignore-scripts && npm --prefix coordination run build
      - name: TypeScript and Rust loopback TLS fixtures
        run: node crates/runner-client/tests/tls-conformance.mjs
  apple-satellite-conformance:
    # Fixture only: fake native helper, ad-hoc signed; no VM, secrets or privileges.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
          cache: npm
          cache-dependency-path: coordination/package-lock.json
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock') }}-apple-satellite
      - run: rustup show
      - run: cargo build -p canaveral-apple-satellite -p canaveral-runner-client --bins --examples --locked
      - run: npm --prefix coordination ci --ignore-scripts && npm --prefix coordination run build
      - name: Public API TypeScript controller and Rust Apple satellite fixture
        run: node fixtures/apple-satellite/public-api.mjs coordination target/debug/canaveral-apple-satellite target/debug/canaveral-runner-client target/debug/examples/fixture-helper
  native-compile:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.0'
          cache: pip
          cache-dependency-path: .github/requirements-test.txt
      - run: python -m pip install --require-hashes -r .github/requirements-test.txt
      - if: runner.os == 'macOS'
        env:
          DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
        run: |
          xcodebuild -version
          test "$(xcrun --show-sdk-version | cut -d. -f1)" -ge 26
          swift build --package-path VirtualMachines
      - if: runner.os == 'Linux'
        run: |
          python script/build_linux_lease_deadline.py --output "$RUNNER_TEMP/deadline.so"
          test -n "$ANDROID_NDK_LATEST_HOME"
          cat "$ANDROID_NDK_LATEST_HOME/source.properties"
          python script/build_android_transfer.py --ndk "$ANDROID_NDK_LATEST_HOME" --output-dir "$RUNNER_TEMP/android-transfer"
  workflow-lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck=""
  ci-required:
    if: ${{ always() }}
    needs: [migration-coordination, migration-execution, validate, dashboard, native-compile, workflow-lint, runner-conformance, model-conformance, apple-satellite-conformance]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PYCODE'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          print(json.dumps(results, indent=2))
          assert results and all(job['result'] == 'success' for job in results.values())
          PYCODE
