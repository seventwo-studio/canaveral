name: Publish Canaveral release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Reviewed existing main tag (for example v0.4.0); dispatch on that tag
        required: true
        type: string
permissions:
  contents: write
  packages: write
  # Signed SLSA build provenance for each published digest.
  id-token: write
  attestations: write
env:
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.tag }}
concurrency:
  group: canaveral-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Validate tag input
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          [[ "$GITHUB_REF" == "refs/tags/$RELEASE_TAG" ]]
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.11.0'
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f
      - name: Install pinned release CLIs
        run: |
          curl --fail --location --retry 3 -o /tmp/kubectl https://dl.k8s.io/release/v1.34.1/bin/linux/amd64/kubectl
          echo '7721f265e18709862655affba5343e85e1980639395d5754473dafaadcaa69e3  /tmp/kubectl' | sha256sum --check
          sudo install -m 0755 /tmp/kubectl /usr/local/bin/kubectl
          curl --fail --location --retry 3 -o /tmp/flux.tar.gz https://github.com/fluxcd/flux2/releases/download/v2.7.5/flux_2.7.5_linux_amd64.tar.gz
          echo '1e92141e8498289e4b27411385aeb18396053176cf297b0cb99abd6ca8293e75  /tmp/flux.tar.gz' | sha256sum --check
          tar -xzf /tmp/flux.tar.gz -C /tmp flux
          sudo install -m 0755 /tmp/flux /usr/local/bin/flux
      - name: Authenticate GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
      - name: Prepare reviewed images and deployment artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node script/publish_release.mjs
      - name: Read published image, deployment and helper digests
        id: digests
        run: |
          node -e '
            const r = JSON.parse(require("fs").readFileSync("dist/release.json", "utf8"));
            const digest = v => { const m = /@(sha256:[a-f0-9]{64})$/.exec(v); if (!m) throw new Error("Unpinned release image"); return m[1]; };
            const out = { orchestrator: digest(r.images.orchestrator), dashboard: digest(r.images.dashboard), canaverald: digest(r.images.canaverald), deploy: r.deployment.digest };
            if (!/^sha256:[a-f0-9]{64}$/.test(out.deploy)) throw new Error("Unpinned deployment artifact");
            for (const arch of ["amd64", "arm64"]) {
              if (!/^[a-f0-9]{64}$/.test(r.libvirtLeaseHelper?.sha256?.[arch])) throw new Error("Unpinned libvirt lease helper");
            }
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, Object.entries(out).map(([k, v]) => k + "=" + v + "\n").join(""));
          '
      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: 'v3.1.4'
      - name: Attest orchestrator provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/seventwo-studio/canaveral/orchestrator
          subject-digest: ${{ steps.digests.outputs.orchestrator }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest dashboard provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/seventwo-studio/canaveral/dashboard
          subject-digest: ${{ steps.digests.outputs.dashboard }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest canaverald provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/seventwo-studio/canaveral/canaverald
          subject-digest: ${{ steps.digests.outputs.canaverald }}
          push-to-registry: true
          create-storage-record: false
      - name: Attest deploy provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/seventwo-studio/canaveral/deploy
          subject-digest: ${{ steps.digests.outputs.deploy }}
          push-to-registry: true
          create-storage-record: false
      - name: Sign completed deployment manifest
        env:
          DEPLOY_DIGEST: ${{ steps.digests.outputs.deploy }}
        run: |
          # Preserve legacy signature compatibility alongside provenance bundles.
          artifact="ghcr.io/seventwo-studio/canaveral/deploy@$DEPLOY_DIGEST"
          cosign sign --yes --new-bundle-format=false --use-signing-config=false "$artifact" > /tmp/cosign-sign.log 2>&1 || { echo 'Deployment signing failed.'; exit 1; }
      - name: Verify and promote stable release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node script/publish_release.mjs --finalize
      - name: Remove registry credentials
        if: always()
        run: |
          docker logout ghcr.io
          rm -f /tmp/cosign-sign.log /tmp/cosign-verify.log
