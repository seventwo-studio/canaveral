name: Build browser VM image
on:
  workflow_call:
    inputs:
      verify_guest:
        description: Boot one disposable ARM64 guest for browser acceptance
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      verify_guest:
        description: Boot one disposable ARM64 guest for browser acceptance
        type: boolean
        default: false
  pull_request:
    paths:
      - 'tools/browser-image/**'
      - '.github/workflows/browser-image.yaml'
      - 'coordination/src/browser-runtime.ts'
      - 'coordination/src/browser-playwright.ts'
      - 'coordination/package-lock.json'
      - 'coordination/package.json'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install disk construction tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libguestfs-tools qemu-system-arm qemu-efi-aarch64 qemu-utils linux-image-generic
      - name: Build and verify ARM64 disk
        env:
          LIBGUESTFS_BACKEND: direct
        run: |
          if [[ ! -c /dev/kvm ]]; then export LIBGUESTFS_HV="$PWD/tools/browser-image/qemu-tcg.sh"; fi
          sudo --preserve-env=LIBGUESTFS_BACKEND,LIBGUESTFS_HV libguestfs-test-tool --timeout 300
          sudo --preserve-env=LIBGUESTFS_BACKEND,LIBGUESTFS_HV bash tools/browser-image/build.sh browser-worker.qcow2
          sudo chmod 0444 browser-worker.qcow2
          sha256sum browser-worker.qcow2 > browser-worker.qcow2.sha256
      - name: Verify disposable ARM64 browser guest
        if: ${{ inputs.verify_guest == true }}
        timeout-minutes: 40
        run: |
          sudo apt-get install -y --no-install-recommends imagemagick
          sudo bash tools/browser-image/ci/acceptance.sh browser-worker.qcow2
          sha256sum -c browser-worker.qcow2.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: browser-worker-arm64
          path: |
            browser-worker.qcow2
            browser-worker.qcow2.sha256
          if-no-files-found: error
          retention-days: 3
