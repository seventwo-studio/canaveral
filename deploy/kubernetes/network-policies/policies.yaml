# Optional example. Adapt API endpoint, DNS and guest access before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: canaveral
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-clients
  namespace: canaveral
spec:
  podSelector:
    matchLabels:
      app: canaveral-orchestrator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: canaveral-dashboard
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: canaveral-guests
          podSelector:
            matchLabels:
              app: canaveral-worker
      ports:
        - protocol: TCP
          port: 8765
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-egress
  namespace: canaveral-guests
spec:
  podSelector:
    matchLabels:
      app: canaveral-worker
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: canaveral
          podSelector:
            matchLabels:
              app: canaveral-orchestrator
      ports:
        - protocol: TCP
          port: 8765
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Documentation-only IP. Replace with API endpoint(s), including post-DNAT
    # addresses as required by your CNI. Never broaden this to all destinations.
    - to:
        - ipBlock:
            cidr: 192.0.2.1/32
      ports:
        - protocol: TCP
          port: 6443
