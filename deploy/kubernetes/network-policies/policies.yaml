# Optional example. Adapt controller ingress for your site before applying.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: canaveral
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress: []
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-clients
  namespace: canaveral
spec:
  podSelector:
    matchLabels:
      app: canaveral-orchestrator
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: canaveral-dashboard
      ports:
        - protocol: TCP
          port: 8765
