# Optional, for bare-metal hosts that lease libvirt VMs (see docs/running.md).
# Each lease guardian destroys its domain through libvirt. If libvirtd is unavailable when
# a lease must end, the guardian kills the recorded QEMU process through a pidfd after
# verifying its birth time. QEMU runs as its own account, so that signal needs CAP_KILL.
# Without this drop-in such a lease stays fenced but unproven: its reservation is kept
# and the guardian receipt reports qemu-kill-denied until libvirtd returns.
# CAP_KILL lets the daemon signal any process on the host; grant it only on dedicated VM hosts.
# Keep the default KillMode=control-group: guardians ignore SIGTERM, fence when the
# daemon exits and leave before TimeoutStopSec.
[Service]
AmbientCapabilities=CAP_KILL
CapabilityBoundingSet=CAP_KILL
