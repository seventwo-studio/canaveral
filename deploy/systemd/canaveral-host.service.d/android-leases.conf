# Install only on hosts that lease Android emulators.
# Leased emulators run under detached lease supervisors that must outlive the host
# process: they keep enforcing each lease deadline while the host restarts. The default
# control-group mode would kill every supervisor and emulator on stop or restart.
# With this drop-in, stop signals the host process only, so other detached helpers and
# unleased emulators also survive a restart and are adopted by the next instance.
[Service]
KillMode=process
