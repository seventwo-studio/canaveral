map $http_upgrade $browser_connection {
    default upgrade;
    '' close;
}
server {
    listen 443 ssl;
    ssl_certificate /etc/canaveral-browser/fullchain.pem;
    ssl_certificate_key /etc/canaveral-browser/key.pem;
    access_log off;
    error_log /dev/null;
    location / {
        proxy_pass http://127.0.0.1:9333;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $browser_connection;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_buffering off;
        add_header Cache-Control no-store always;
    }
}
