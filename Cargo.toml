[workspace]
members = ["crates/execution-core", "crates/runner-client", "crates/model-execution", "crates/kubevirt-execution"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["serde"] }
