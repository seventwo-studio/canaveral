[workspace]
members = ["crates/boot-bundle", "crates/guest-protocol", "crates/guest-agent", "crates/execution-core", "crates/runner-client", "crates/model-execution", "crates/apple-satellite", "crates/kubevirt-execution", "crates/mobile-native", "crates/apple-native"]
resolver = "2"

[workspace.package]
edition = "2021"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
uuid = { version = "1", features = ["serde"] }
