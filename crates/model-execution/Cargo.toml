[package]
name = "canaveral-model-execution"
version = "0.1.0"
edition.workspace = true

[dependencies]
canaveral-execution-core = { path = "../execution-core" }
canaveral-runner-client = { path = "../runner-client" }
getrandom = "0.3"

serde.workspace = true
serde_json.workspace = true
uuid.workspace = true
libc = "0.2"
sha2 = "0.10"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
ruzstd = { version = "0.9.1", default-features = false, features = ["std"] }
tar = { version = "0.4.46", default-features = false }
zip = { version = "8", default-features = false, features = ["deflate-flate2"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cc = "1"

[[test]]
name = "runtime_fixture"
path = "tests/runtime_fixture.rs"
harness = false
